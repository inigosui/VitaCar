; VitaCar - puente ESP32 (iPhone -> Vita)
; Placa: ESP32 DevKit V4 (ESP32-WROOM-32). Pantalla: GMT130 240x240 ST7789 sin CS.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; WiFi + Bluetooth no caben en la partición normal de 1,2 MB.
board_build.partitions = huge_app.csv
; Que abrir el monitor no deje la placa reiniciada o en modo grabación.
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.11
    bblanchon/ArduinoJson@^7.2.1
    h2zero/NimBLE-Arduino@^2.1.0
